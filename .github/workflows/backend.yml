name: Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    env:
      TESTCONTAINERS_RYUK_DISABLED: true
      DOCKER_BUILDKIT: 1

    steps:
      - name: "[Init] Checkout code"
        uses: actions/checkout@v4

      - name: "[Init] Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          global-json-file: backend/global.json

      - name: "[Check] Check code formatting"
        working-directory: backend
        run: |
          set -e
          ./format.sh
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Code formatting issues detected. Please run ./format.sh locally and commit the changes."
            git diff
            exit 1
          fi

      - name: "[Build] Restore dependencies"
        working-directory: backend
        run: dotnet restore Personal.Budget.slnx

      - name: "[Build] Build solution"
        working-directory: backend
        run: dotnet build Personal.Budget.slnx --configuration Release --no-restore

      - name: "[Test] Run tests"
        working-directory: backend
        run: ./run-test.sh --ci
