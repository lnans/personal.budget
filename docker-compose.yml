name: personal-budget

services:
  budget-db:
    image: postgres:16-alpine
    container_name: budget-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespw}
      POSTGRES_DB: ${DB_NAME:-budget-sqldb}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  budget-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budget-api
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      budget-db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}

      - ConnectionStrings__Database=Server=${DB_HOST:-budget-db};Database=${DB_NAME:-budget-sqldb};User Id=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgrespw};

      - Auth__SecretKey=${JWT_SECRET_KEY:-your-super-secret-key-change-this-in-production-min-32-chars}
      - Auth__Issuer=budget.api
      - Auth__Audience=budget.users
      - Auth__ExpirationMinutes=60
      - Auth__RefreshTokenExpirationDays=7

      - BUDGET_USER=${BUDGET_USER:-admin}
      - BUDGET_PASSWORD=${BUDGET_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  budget-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: budget-web
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      budget-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
